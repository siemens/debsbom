name: Tests

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  test-minimal-deps:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sbom-type: ["cdx", "spdx"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.15

      - name: Install required dependencies for ${{ matrix.sbom-type }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install .[${{ matrix.sbom-type }}]

      - name: Test the generate command with minimal dependencies for ${{ matrix.sbom-type }}
        shell: bash
        run: $(which debsbom) -v generate -t ${{ matrix.sbom-type }} -o sbom --root tests/root/tree --validate

      - name: Install test dependencies for ${{ matrix.sbom-type }}
        shell: bash
        run: pip install .[mindev]
      - name: Test pytest for subset ${{ matrix.sbom-type }}
        shell: bash
        run: pytest

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11.2", "3.11", "3.12", "3.13.5", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: ./.github/actions/pytest
        with:
          artifact-identifier: "${{ matrix.python-version }}"

  test-python-apt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check if python-apt is available
        run: python -c "import apt"
      - uses: ./.github/actions/pytest
        with:
          artifact-identifier: "python-apt"

  test-debian-trixie-compat:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install other required dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 \
            python-is-python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            dpkg-dev \
            bzip2 \
            gzip \
            xz-utils \
            zstd \
            lz4
      - name: Install debsbom dependencies from apt
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            black \
            python3-apt \
            python3-beartype \
            python3-coverage \
            python3-cyclonedx-lib \
            python3-debian \
            python3-jsonschema \
            python3-license-expression \
            python3-lz4 \
            python3-networkx \
            python3-packageurl \
            python3-pytest \
            python3-pytest-cov \
            python3-requests \
            python3-shtab \
            python3-zstandard
          rm -rf /var/lib/apt/lists/*
          ln -s /usr/bin/python3-coverage /usr/local/bin/coverage
      - name: Install debsbom with system packages only
        run: |
          # Install spdx-tools and pyshacl with pip, as they are currently not available in trixie
          pip install pyshacl==0.40.1 spdx-tools==0.8.5 --break-system-packages
          pip install . --break-system-packages --no-deps
      - uses: ./.github/actions/pytest
        with:
          artifact-identifier: "debian-trixie-compat"
          skip-setup: "true"

  coverage:
    name: Check coverage
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.15

      - name: Install dependencies
        run: |
          python -m pip install --upgrade coverage[toml]
          pip install .[dev]

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Check coverage and fail it it’s under 85%
        run: |
          cat >.coveragerc <<EOF
          [run]
          source = debsbom
          [paths]
          source =
              src/debsbom
              */site-packages/debsbom
              */runner/work/debsbom/src/debsbom
              */dist-packages/debsbom
          EOF

          python -m coverage combine
          python -m coverage html --skip-covered --skip-empty

          # Report and write to summary.
          python -m coverage report | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY

          # Report again and fail if under 85%.
          python -Im coverage report --fail-under=85

      - name: Upload HTML report if check failed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-report
          path: htmlcov
        if: ${{ failure() }}
